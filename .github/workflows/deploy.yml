name: Build & Deploy to DirectAdmin

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        env:
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
        run: npm run build

      - name: Create OAuth config
        env:
          OAUTH_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
        run: |
          mkdir -p ./out/auth
          printf '<?php\nreturn [\n    "client_id"     => "%s",\n    "client_secret" => "%s",\n    "redirect_uri"  => "https://1992land.com/auth/callback.php",\n];\n' "$OAUTH_ID" "$OAUTH_SECRET" > ./out/auth/config.php

      - name: Deploy via FTP to DirectAdmin
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./out/
          server-dir: /public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
